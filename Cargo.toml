[workspace]
resolver = "2"
members = [
    "rust-core/agda-lexparse",
    "rust-core/agda-octad-importer",
    "rust-core/agda-octad-prober",
    "rust-core/cross-repo-bridge-probe",
]

[workspace.package]
version = "0.1.0"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
edition = "2021"
license = "MPL-2.0"
# (PMPL-1.0-or-later preferred; MPL-2.0 declared explicitly because crates.io
# requires an OSI-approved licence on workspace member metadata.)

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
